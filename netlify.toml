[build]
  publish = "."
  command = "npm install && npm run build"

# Specific routes must come before the catch-all below.

# The /quest and /lab-ordering landing pages were merged into /lablink
# when the product became LabLink. Keep old links and search results
# working.
[[redirects]]
  from = "/quest"
  to = "/lablink"
  status = 301

[[redirects]]
  from = "/quest.html"
  to = "/lablink"
  status = 301

[[redirects]]
  from = "/lab-ordering"
  to = "/lablink"
  status = 301

[[redirects]]
  from = "/lab-ordering.html"
  to = "/lablink"
  status = 301

[[redirects]]
  from = "/quest-thanks"
  to = "/thanks"
  status = 301

[[redirects]]
  from = "/quest-thanks.html"
  to = "/thanks"
  status = 301

[[redirects]]
  from = "/lablink"
  to = "/lablink.html"
  status = 200

[[redirects]]
  from = "/thanks"
  to = "/thanks.html"
  status = 200

[[redirects]]
  from = "/terms-of-use"
  to = "/terms-of-use.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
